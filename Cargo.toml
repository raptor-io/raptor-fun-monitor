[package]
name = "pumpfun_monitor"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# Upgrade carbon-core to match datasource
carbon-core = "0.8"
carbon-rpc-block-subscribe-datasource = "0.8"

# 所有Solana依赖锁定到可用的2.2.1版本
solana-sdk = "=2.2.1"
solana-client = "=2.2.1"
solana-pubkey = { version = "=2.2.1", features = ["serde"] }
solana-transaction-status = "=2.2.1"
solana-instruction = "=2.2.1"

# 移除anchor-lang依赖
async-trait = "0.1"
dotenv = "0.15"
env_logger = "0.10"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["full"] } 